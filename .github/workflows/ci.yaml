name: tests

on:
  push:
    branches: ["**"]
    # The suite reads firmware sources directly: test_device_contract.py parses
    # frame_client.c, and test_portal.py parses provisioning.c through
    # portal_preview.py. So firmware changes must re-run the Python tests even
    # though no Python changed.
    paths:
      - "src/**"
      - "tests/**"
      - "firmware/main/**"
      - "firmware/tools/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "firmware/main/**"
      - "firmware/tools/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yaml"
  workflow_call:      # release workflows gate on this; paths do not apply here

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      # fonts-dejavu-core matches the runtime image; without a TrueType font
      # the overlay silently falls back to PIL's bitmap font and the caption
      # geometry tests measure something different from production.
      - name: Install fonts
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core

      - name: Run tests
        run: pytest -q
