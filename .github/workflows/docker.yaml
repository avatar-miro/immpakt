name: docker

# No `paths:` on the trigger: GitHub ANDs ref and path filters, so a tag whose
# commit touched only docs would skip its own release. The `changes` job below
# decides instead, comparing a tag against the PREVIOUS TAG -- what matters for
# a release is "did the image move since the last one", not "did this one
# commit touch it".
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.d.outputs.build }}
      publish: ${{ steps.d.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need tags and history to diff against

      - name: Did the image change?
        id: d
        shell: bash
        env:
          PATHS: '^(src/|pyproject\.toml|Dockerfile|docker-entrypoint\.sh|\.dockerignore|\.github/workflows/docker\.yaml)'
        run: |
          set -euo pipefail
          is_tag=false
          [[ "$GITHUB_REF" == refs/tags/* ]] && is_tag=true

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "build=true"    >> "$GITHUB_OUTPUT"
            echo "publish=true"  >> "$GITHUB_OUTPUT"; exit 0
          fi

          if $is_tag; then
            prev=$(git tag --sort=-creatordate | grep -vFx "$GITHUB_REF_NAME" | head -1 || true)
            if [[ -z "$prev" ]]; then
              echo "::notice::no previous tag; treating as the first image release"
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            base="$prev"
            echo "comparing $GITHUB_REF_NAME against $prev"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "publish=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          changed=$(git diff --name-only "$base" "$GITHUB_SHA" || true)
          echo "changed:"; echo "$changed" | sed 's/^/  /'

          if grep -qE "$PATHS" <<<"$changed"; then
            echo "build=true"   >> "$GITHUB_OUTPUT"
            echo "publish=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false"   >> "$GITHUB_OUTPUT"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            if $is_tag; then
              echo "::notice::image unchanged since $base -- not republishing for $GITHUB_REF_NAME"
            else
              echo "::notice::nothing affecting the image changed; skipping"
            fi
          fi

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: [changes, test]
    if: needs.changes.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      # Pull requests build to prove the Dockerfile still works, but never
      # push -- a fork's PR must not be able to publish under your account.
      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_PAT }}

      - name: Work out tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Fallback keeps fork PRs working: their secrets are empty, and a
          # bare "/immpakt" is not a valid image name. Those runs build but
          # never push, so the placeholder is never published.
          images: ${{ secrets.DOCKERHUB_USER || 'local' }}/immpakt
          # A git tag v1.2.3 publishes 1.2.3, 1.2 and latest.
          # Anything else (a push to main) publishes only :snapshot, so
          # `latest` never silently moves to an untagged commit.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=snapshot,enable=${{ !startsWith(github.ref, 'refs/tags/') }}
          flavor: |
            latest=auto

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        if: github.event_name != 'pull_request'
        run: |
          {
            echo "### Pushed"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
