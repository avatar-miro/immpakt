name: firmware

# No `paths:` on the trigger: GitHub ANDs ref and path filters, so a tag whose
# commit touched only docs would skip its own release. The `changes` job below
# decides instead, comparing against the PREVIOUS TAG rather than the previous
# commit -- what matters for a release is "did the firmware move since the last
# one", not "did this one commit touch it".
on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.d.outputs.build }}
      release: ${{ steps.d.outputs.release }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # need tags and history to diff against

      - name: Did the firmware change?
        id: d
        shell: bash
        env:
          PATHS: '^(firmware/|\.github/workflows/firmware\.yaml)'
        run: |
          set -euo pipefail
          is_tag=false
          [[ "$GITHUB_REF" == refs/tags/* ]] && is_tag=true

          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # Explicit manual run: build so the artifacts exist, never release.
            echo "build=true"   >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if $is_tag; then
            prev=$(git tag --sort=-creatordate | grep -vFx "$GITHUB_REF_NAME" | head -1 || true)
            if [[ -z "$prev" ]]; then
              echo "::notice::no previous tag; treating as the first firmware release"
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
            fi
            base="$prev"
            echo "comparing $GITHUB_REF_NAME against $prev"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            if [[ -z "$base" || "$base" == 0000000000000000000000000000000000000000 ]] \
               || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              echo "build=true" >> "$GITHUB_OUTPUT"; echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
            fi
          fi

          changed=$(git diff --name-only "$base" "$GITHUB_SHA" || true)
          echo "changed:"; echo "$changed" | sed 's/^/  /'

          if grep -qE "$PATHS" <<<"$changed"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "release=$is_tag" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            if $is_tag; then
              echo "::notice::firmware unchanged since $base -- no firmware release for $GITHUB_REF_NAME"
            else
              echo "::notice::no firmware changes; skipping"
            fi
          fi

  test:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    uses: ./.github/workflows/ci.yaml

  build:
    needs: [changes, test]
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    # Same image build.sh uses locally, so CI cannot drift from your desk.
    container: espressif/idf:release-v5.3
    permissions:
      contents: write     # to create the release
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          # The IDF image sets its environment in an entrypoint that `container:`
          # replaces, so export.sh has to be sourced by hand here.
          . "$IDF_PATH/export.sh"
          cd firmware
          idf.py set-target esp32c3 build

      - name: Check the tag matches the firmware's own version string
        if: needs.changes.outputs.release == 'true'
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          fw=$(grep -oP '#define FW_VERSION\s+"\K[^"]+' firmware/main/defaults.h)
          if [ "$tag" != "$fw" ]; then
            echo "::warning::tag $GITHUB_REF_NAME does not match FW_VERSION '$fw' in defaults.h — the released binary will report '$fw' at boot"
          fi

      - name: Package
        shell: bash
        working-directory: firmware
        run: |
          . "$IDF_PATH/export.sh"
          mkdir -p dist
          cp build/immpakt.bin \
             build/bootloader/bootloader.bin \
             build/partition_table/partition-table.bin dist/

          # One flat image for a single-command flash and for browser-based
          # flashers, alongside the three-part set for esptool users.
          esptool.py --chip esp32c3 merge_bin -o dist/immpakt-merged.bin \
            --flash_mode dio --flash_freq 80m --flash_size 16MB \
            0x0     build/bootloader/bootloader.bin \
            0x8000  build/partition_table/partition-table.bin \
            0x10000 build/immpakt.bin

          cd dist && sha256sum ./*.bin > SHA256SUMS && cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: immpakt-firmware
          path: firmware/dist/*

      - name: Release
        if: needs.changes.outputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: firmware/dist/*
          generate_release_notes: true
          body: |
            ## Flashing

            **Back up your stock firmware first.** Replacing it is not reversible
            without a verified dump:

            ```bash
            firmware/backup-stock.sh
            ```

            Then either flash the single merged image:

            ```bash
            esptool.py --chip esp32c3 --port /dev/cu.usbmodemXXXX \
              write_flash 0x0 immpakt-merged.bin
            ```

            or the three parts individually:

            ```bash
            esptool.py --chip esp32c3 --port /dev/cu.usbmodemXXXX write_flash \
              0x0     bootloader.bin \
              0x8000  partition-table.bin \
              0x10000 immpakt.bin
            ```

            First boot opens the setup portal: join Wi-Fi **ImmPakt-Setup**
            (password `immpakt123`), open <http://192.168.4.1>, and point
            **Server URL** at your ImmPakt server.

            Firmware is AGPL-3.0 by descent from
            [varanu5/picpak-tesserae-client](https://github.com/varanu5/picpak-tesserae-client).
