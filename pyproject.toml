[project]
name = "immpakt"
version = "0.0.1"
description = "Serve Immich photos to a PicPak 4.2\" four-colour e-ink frame"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pillow>=10.0",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "python-multipart>=0.0.9",   # login form posts
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
immpakt = "immpakt.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
