<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256"
     role="img" aria-label="ImmPakt">
  <title>ImmPakt</title>
  <!-- PicPak silhouette: body, e-ink panel, front button, wordmark bar.
       One Immich brand colour per shape, the fifth as the outline. Hexes from
       immich-app/immich design/immich-logo.svg.
       The inner shapes sit in TRANSPARENT moats cut through the body, so the
       gaps take the page colour rather than being painted white. -->
  <defs>
    <mask id="immpakt-moat">
      <rect width="256" height="256" fill="#fff"/>
      <rect x="16.13" y="16.13" width="223.74" height="164.86" rx="20.99" fill="#000"/>
      <circle cx="55.04" cy="216.32" r="29.95" fill="#000"/>
      <rect x="85.25" y="196.61" width="154.62" height="39.42" rx="16.13" fill="#000"/>
    </mask>
  </defs>
  <rect x="2.56" y="2.56" width="250.88" height="250.88" rx="25.6" ry="25.6"
        fill="#1E83F7" stroke="#FFB400" stroke-width="5.12" mask="url(#immpakt-moat)"/>
  <rect x="26.88" y="26.88" width="202.24" height="143.36" rx="10.24" fill="#ED79B5"/>
  <circle cx="55.04" cy="216.32" r="19.2" fill="#FA2921"/>
  <rect x="96" y="207.36" width="133.12" height="17.92" rx="5.38" fill="#18C249"/>
</svg>
